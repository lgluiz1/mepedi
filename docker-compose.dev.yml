# ==============================================================================
# MePedi - Docker Compose para Desenvolvimento e Testes Locais
#
# Uso no ambiente local:
#   docker compose -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.dev.yml logs -f web
#   docker compose -f docker-compose.dev.yml down
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: ia_pedidos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ia_pedidos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ia_pedidos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ia_pedidos_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-mvp-super-secret-key-change-in-production}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ia_pedidos}
      - ALLOWED_HOSTS=*
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
