{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login do Lojista | IA-Pedidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/menu.css' %}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #e0e7ff 0%, #f8fafc 60%);
      padding: 20px;
      box-sizing: border-box;
      color: #0f172a;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 1px 1px rgba(0, 0, 0, 0.02);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      font-weight: 800;
      font-size: 1.1rem;
      padding: 6px 16px;
      border-radius: 9999px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }
    .form-control {
      width: 100%;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 12px 14px;
      color: #0f172a;
      font-size: 0.95rem;
      font-family: inherit;
      box-sizing: border-box;
      transition: all 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }
    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div style="text-align:center; margin-bottom:28px;">
      <span class="logo-badge">IA-Pedidos</span>
      <h1 style="font-size:1.6rem; font-weight:800; margin:0 0 8px 0; color:#0f172a;">Painel do Lojista</h1>
      <p style="color:#64748b; font-size:0.9rem; margin:0;">Faça login para acompanhar e gerenciar seus pedidos em tempo real</p>
    </div>

    {% if error %}
      <div class="alert-error">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="email">E-mail Comercial</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="seu-email@loja.com.br" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Senha de Acesso</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; font-weight:700; font-size:1rem; border-radius:10px; margin-top:8px;">
        Entrar no Painel
      </button>
    </form>

    <div style="text-align:center; margin-top:24px; padding-top:20px; border-top:1px solid #f1f5f9;">
      <a href="/" style="color:#64748b; text-decoration:none; font-size:0.85rem; font-weight:600;">← Voltar para o início</a>
    </div>
  </div>

</body>
</html>
