{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MePedi | Plataforma de Cardápio Digital e Pedidos{% endblock %}</title>
  <meta name="description" content="MePedi - Plataforma SaaS multi-loja de cardápio digital e gestão de pedidos online para comerciantes locais.">
  <link rel="icon" type="image/png" href="{% static 'img/favicon-mepedi.png' %}">
  <link rel="shortcut icon" type="image/png" href="{% static 'img/favicon-mepedi.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar container">
    <a href="{% url 'core:home' %}" class="logo-brand" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
      <img src="{% static 'img/mepedi-logo.png' %}" alt="MePedi" style="height:38px; width:auto; object-fit:contain;">
    </a>
    <div class="nav-links">
      <a href="{% url 'core:health_check' %}" class="nav-link">Status da API</a>
      <a href="/admin/" class="btn btn-outline">Painel Admin</a>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer container">
    <p>&copy; 2026 MePedi. Plataforma de Cardápio Digital & Pedidos.</p>
  </footer>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
